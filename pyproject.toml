[project]
name = "sawman-rpg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "joshtgm@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numba>=0.67.0",
    "pygame-ce>=2.5.8",
    "pytz>=2026.3.post1",
]

[project.scripts]
sawman-rpg = "sawman_rpg:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
pygameshader = ["config"]
